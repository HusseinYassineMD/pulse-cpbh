# One-click hosted Pulse (API + Postgres + Next.js web)
# Dashboard: New → Blueprint → connect github.com/HusseinYassineMD/pulse-cpbh
databases:
  - name: pulse-cpbh-db
    databaseName: pulse
    user: pulse
    plan: free
    region: oregon

services:
  - type: web
    name: pulse-cpbh-api
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: chmod +x start_prod.sh && ./start_prod.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: APP_ENV
        value: production
      - key: AUTH_ENABLED
        value: "false"
      - key: PUBLISH_DRY_RUN
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-cpbh-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: MEDIA_PUBLISH_KEY
        generateValue: true
      - key: API_URL
        fromService:
          type: web
          name: pulse-cpbh-api
          property: host
      - key: PUBLISH_API_URL
        fromService:
          type: web
          name: pulse-cpbh-api
          property: host
      - key: WEB_URL
        fromService:
          type: web
          name: pulse-cpbh-web
          property: host

  - type: web
    name: pulse-cpbh-web
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          type: web
          name: pulse-cpbh-api
          property: host
