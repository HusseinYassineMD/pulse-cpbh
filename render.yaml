# One-click hosted Pulse (API + Postgres + Next.js web)
# Dashboard: New → Blueprint → connect github.com/HusseinYassineMD/pulse-cpbh
# Or run: ./start.sh host
#
# Note: API and web do not cross-reference each other's env here (avoids Blueprint UI hanging).
# After both are Live, set WEB_URL on pulse-cpbh-api to your pulse-cpbh-web URL (https://…onrender.com).
databases:
  - name: pulse-cpbh-db
    databaseName: pulse
    user: pulse
    plan: free
    region: oregon

services:
  - type: web
    name: pulse-cpbh-api
    runtime: python
    region: oregon
    plan: free
    repo: https://github.com/HusseinYassineMD/pulse-cpbh
    branch: main
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: chmod +x start_prod.sh && ./start_prod.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: APP_ENV
        value: production
      - key: AUTH_ENABLED
        value: "false"
      - key: PUBLISH_DRY_RUN
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-cpbh-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: MEDIA_PUBLISH_KEY
        generateValue: true
      - key: API_URL
        fromService:
          type: web
          name: pulse-cpbh-api
          property: host
      - key: PUBLISH_API_URL
        fromService:
          type: web
          name: pulse-cpbh-api
          property: host
      - key: WEB_URL
        fromService:
          type: web
          name: pulse-cpbh-web
          property: host
      - key: REVIEW_LEAD_EMAIL
        value: ajagadis@usc.edu
      # Create at resend.com → API Keys — paste in Render if not synced from blueprint:
      - key: RESEND_API_KEY
        sync: false
      - key: REVIEW_REMINDER_HOURS
        value: "12"

  - type: web
    name: pulse-cpbh-web
    runtime: node
    region: oregon
    plan: free
    repo: https://github.com/HusseinYassineMD/pulse-cpbh
    branch: main
    rootDir: apps/web
    # Install devDependencies for next build (NODE_ENV=production would skip them)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_STATIC_MODE
        value: "false"
      - key: API_URL
        value: https://pulse-cpbh-api.onrender.com
      # Shared secret for Tiffany / leads — students never need this (Review & Schedule only).
      - key: LEAD_ACCESS_PIN
        sync: false

  # Pings API + web every 14 min so student Submit stays fast (free tier sleeps ~15 min idle).
  - type: cron
    name: pulse-cpbh-keep-warm
    runtime: node
    region: oregon
    schedule: "*/14 * * * *"
    startCommand: >-
      node -e "const u=['https://pulse-cpbh-api.onrender.com/health','https://pulse-cpbh-web.onrender.com/api/warm'];
      Promise.allSettled(u.map(x=>fetch(x,{signal:AbortSignal.timeout(55000)}))).then(()=>process.exit(0));"
    envVars:
      - key: NODE_VERSION
        value: "20"
